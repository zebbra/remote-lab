copyright: Copyright &copy; Zebbra AG
edit_uri: edit/main/docs
extra:
  social:
  - icon: fontawesome/solid/house
    link: https://zebbra.ch
    name: Zebbra
hooks:
- .make_scripts/mkdocs-documentation/hooks/inline_nav_include.py
- .make_scripts/mkdocs-documentation/hooks/fix_symlinks.py
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
      name: mermaid
- pymdownx.inlinehilite
- pymdownx.snippets:
    base_path:
    - !relative
    check_paths: true
    restrict_base_path: false
- pymdownx.emoji:
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
    emoji_index: !!python/name:material.extensions.emoji.twemoji
- attr_list
- md_in_html
nav:
- Home: index.md
- Getting Started:
  - getting-started/index.md
  - Setup: getting-started/10-setup.md
  - Your First Lab Session: getting-started/20-first-lab.md
  - Using Pytest Fixtures: getting-started/30-pytest-fixtures.md
- Concepts:
  - 10-concepts/index.md
  - Architecture: 10-concepts/10-architecture.md
  - Session Queue: 10-concepts/20-session-queue.md
  - Lab Lifecycle: 10-concepts/30-lab-lifecycle.md
  - Topology Format: 10-concepts/40-topology-format.md
- Server:
  - 20-server/index.md
  - REST API: 20-server/10-rest-api.md
  - Configuration: 20-server/20-configuration.md
  - Administration: 20-server/30-administration.md
- Client:
  - 30-client/index.md
  - RemoteLabClient API: 30-client/10-remote-lab-client.md
  - Pytest Fixtures: 30-client/20-pytest-fixtures.md
- Testing:
  - 40-testing/index.md
  - Test Environment Setup: 40-testing/10-setup.md
  - Local Lab Testing: 40-testing/20-local-testing.md
  - Remote Lab Testing: 40-testing/30-remote-testing.md
  - Debugging: 40-testing/40-debugging.md
- Deployment:
  - 50-deployment/index.md
  - Netlab Configuration: 50-deployment/10-netlab-configuration.md
  - Headscale VPN: 50-deployment/20-headscale-vpn.md
  - Production: 50-deployment/30-production.md
- Development:
  - 60-development/index.md
  - Internal Architecture: 60-development/10-architecture.md
  - Data Models: 60-development/20-data-models.md
  - Contributing: 60-development/30-contributing.md
- Appendix:
  - 99-appendix/index.md
  - Glossary: 99-appendix/glossary.md
  - Examples: 99-appendix/examples.md
  - Resources: 99-appendix/resources.md
plugins:
- search
- include_dir_to_nav
- monorepo
- exclude:
    glob:
    - '*.tmp'
    - '*.pdf'
    - '*.gz'
    - node_modules
    - '**/node_modules/*'
    - .venv
    - '**/.venv/*'
    regex:
    - .*\.(tmp|bin|tar)$
repo_url: https://github.com/zebbra/neops
site_name: Neops Remote Lab
theme:
  custom_dir: docs/override
  favicon: assets/favicon.png
  features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - header.autohide
  - announce.dismiss
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - navigation.instant
  - search.share
  - search.suggest
  - search.highlight
  - content.action.edit
  logo: assets/logo.svg
  name: material
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: material/link
      name: Switch to light mode
  - accent: indigo
    media: '(prefers-color-scheme: light)'
    primary: blue grey
    scheme: default
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode
  - accent: deep orange
    media: '(prefers-color-scheme: dark)'
    primary: black
    scheme: slate
    toggle:
      icon: material/toggle-switch-off
      name: Switch to system preference
