copyright: Copyright &copy; Zebbra AG
edit_uri: edit/main/docs
extra:
  social:
  - icon: fontawesome/solid/house
    link: https://zebbra.ch
    name: Zebbra
hooks:
- .make_scripts/mkdocs-documentation/hooks/inline_nav_include.py
- .make_scripts/mkdocs-documentation/hooks/fix_symlinks.py
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
      name: mermaid
- pymdownx.inlinehilite
- pymdownx.snippets:
    base_path:
    - !relative
    check_paths: true
    restrict_base_path: false
- pymdownx.emoji:
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
    emoji_index: !!python/name:material.extensions.emoji.twemoji
- attr_list
- md_in_html
- pymdownx.tabbed:
    alternate_style: true
nav:
- Start: index.md
- Getting Started:
  - getting-started/index.md
  - getting-started/10-quickstart.md
  - getting-started/20-local-server.md
- Concepts:
  - 10-concepts/index.md
  - 10-concepts/10-architecture.md
  - 10-concepts/20-session-queue.md
  - 10-concepts/30-lab-lifecycle.md
  - 10-concepts/40-topology-format.md
- Client:
  - 20-client/index.md
  - 20-client/10-pytest-fixtures.md
  - 20-client/20-python-client.md
- Server:
  - 30-server/index.md
  - 30-server/10-rest-api.md
  - 30-server/20-configuration.md
  - 30-server/30-administration.md
- Deployment:
  - 40-deployment/index.md
  - 40-deployment/10-netlab-host-setup.md
  - 40-deployment/20-headscale-vpn.md
  - 40-deployment/30-vendor-images.md
- Contributing:
  - 50-contributing/index.md
  - 50-contributing/10-dev-setup.md
  - 50-contributing/20-invariants.md
plugins:
- search
- include_dir_to_nav
- monorepo
- exclude:
    glob:
    - '*.tmp'
    - '*.pdf'
    - '*.gz'
    - node_modules
    - '**/node_modules/*'
    - .venv
    - '**/.venv/*'
    regex:
    - .*\.(tmp|bin|tar)$
repo_url: https://github.com/zebbra/neops-remote-lab
site_name: Neops Remote Lab
theme:
  custom_dir: docs/override
  favicon: assets/favicon.png
  features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - header.autohide
  - announce.dismiss
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - navigation.instant
  - search.share
  - search.suggest
  - search.highlight
  - content.action.edit
  logo: assets/logo.svg
  name: material
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: material/link
      name: Switch to light mode
  - accent: indigo
    media: '(prefers-color-scheme: light)'
    primary: blue grey
    scheme: default
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode
  - accent: deep orange
    media: '(prefers-color-scheme: dark)'
    primary: black
    scheme: slate
    toggle:
      icon: material/toggle-switch-off
      name: Switch to system preference
