plugins:
- search
- include_dir_to_nav
- monorepo
- exclude:
    glob:
    - '*.tmp'
    - '*.pdf'
    - '*.gz'
    - node_modules
    - '**/node_modules/*'
    - .venv
    - '**/.venv/*'
    - includes/*
    regex:
    - .*\.(tmp|bin|tar)$
repo_url: https://github.com/zebbra/remote-lab
site_name: Neops Remote Lab
theme:
  custom_dir: docs/override
  favicon: assets/favicon.png
  features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - header.autohide
  - announce.dismiss
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.path
  - navigation.top
  - navigation.tracking
  - navigation.instant
  - search.share
  - search.suggest
  - search.highlight
  - content.action.edit
  - toc.follow
  logo: assets/logo.svg
  name: material
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: material/link
      name: Switch to light mode
  - accent: indigo
    media: '(prefers-color-scheme: light)'
    primary: blue grey
    scheme: default
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode
  - accent: deep orange
    media: '(prefers-color-scheme: dark)'
    primary: black
    scheme: slate
    toggle:
      icon: material/toggle-switch-off
      name: Switch to system preference
