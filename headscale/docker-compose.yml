services:
  headplane:
    # I recommend you pin the version to a specific release
    image: ghcr.io/tale/headplane:0.6.0
    container_name: headplane
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - './headplane.config.yaml:/etc/headplane/config.yaml'
      # This should match headscale.config_path in your config.yaml
      - './config/config.yaml:/etc/headscale/config.yaml'

      # If using dns.extra_records in Headscale (recommended), this should
      # match the headscale.dns_records_path in your config.yaml
      - './config/dns_records.json:/etc/headscale/dns_records.json'

      # Headplane stores its data in this directory
      - './headplane-data:/var/lib/headplane'

      # If you are using the Docker integration, mount the Docker socket
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
  headscale:
    image: headscale/headscale:0.26
    container_name: headscale
    restart: unless-stopped
    command: serve
    labels:
      # This is needed for Headplane to find it and signal it
      me.tale.headplane.target: headscale
    ports:
      - '8080:8080' # TODO evaluate if this is correct
      - '9090:9090' # TODO evaluate if this is correct
    volumes:
      - './lib:/var/lib/headscale'
      - './run:/var/run/headscale'
      # Mount the entire config directory
      - './config:/etc/headscale'
      # Explicitly mount DERP map to ensure it's present even if config dir mapping changes
      - './config/derp.yaml:/etc/headscale/derp.yaml'
