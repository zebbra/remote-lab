name: Release (Docker + PyPI)

on:
  push:
    tags:
      - '*'


jobs:
  check-semver:
    runs-on: hetzner
    steps:
      - name: Check semver integrity
        uses: zebbra/actions/check-semver@check-semver/v1
        
  publish-python-package:
    runs-on: hetzner
    needs: check-semver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build Python package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Raw tag: ${TAG}"
          VERSION="${TAG#v}"
          if [ -z "${VERSION}" ]; then
            echo "Tag name missing."
            exit 1
          fi
          echo "Using tag ${TAG} -> version ${VERSION}"

          pip install --upgrade pip
          pip install poetry
          poetry version "${VERSION}"
          poetry build
          echo "Built version ${VERSION}"

      - name: Publish Python package
        env:
          PYPI_TOKEN: ${{ secrets.PY_PI_TOKEN }}
        run: |
          pip install poetry
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN secret token is not set. Exiting."
            exit 1
          fi
          poetry config pypi-token.pypi $PYPI_TOKEN
          (poetry publish --skip-existing --no-interaction) || true
