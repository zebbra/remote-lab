name: Release (PyPI)

on:
  push:
    tags:
      - 'v*'


jobs:
  check-semver:
    runs-on: hetzner
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Check semver integrity
        id: semver
        uses: zebbra/actions/check-semver@check-semver/latest
        
  publish-pypi:
    name: Publish to PyPI
    runs-on: hetzner
    needs: check-semver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies (prod)
        run: uv sync --frozen

      - name: Security audit (production dependencies only)
        run: uv run pip-audit --strict --progress-spinner=off --vulnerability-service osv

      - name: Run tests
        run: uv run pytest

      - name: Build Python package
        env:
          HATCH_BUILD_VERSION: ${{ needs.check-semver.outputs.version }}
        run: uv build

      - name: Publish Python package
        env:
          PYPI_TOKEN: ${{ secrets.PY_PI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN secret token is not set. Exiting."
            exit 1
          fi
          # uv does not support `--skip-existing`; use the Simple API to pre-check existing distributions.
          uv publish --token "$PYPI_TOKEN" --check-url https://pypi.org/simple/
  create-github-release:
    name: GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release (for non-beta releases)
        uses: zebbra/actions/github-release@github-release/latest