name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    name: Lint, type-check, audit, fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv and Poetry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_python.outputs.python-version }}-

      - name: Install Poetry & dependencies
        run: |
          pip install --quiet poetry
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --with dev

      - name: Lint & Type-check
        run: |
          poetry run black --check neops_remote_lab
          poetry run pylint --fail-under=9.5 neops_remote_lab
          poetry run mypy neops_remote_lab

      - name: Run tests
        run: poetry run pytest

      - name: Summary
        run: echo "### Lint/type-check/audit/tests passed ✅" >> $GITHUB_STEP_SUMMARY

  wheel:
    name: Build Python wheel (no publish)
    needs: lint-test
    runs-on: hetzner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip (for Poetry install)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_python.outputs.python-version }}-poetry
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_python.outputs.python-version }}-

      - name: Install Poetry
        run: |
          pip install --quiet poetry

      - name: Build wheel
        run: poetry build -f wheel

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl
