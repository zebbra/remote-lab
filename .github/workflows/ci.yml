name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    name: Lint, type-check, audit, fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies (dev)
        run: uv sync --group dev --frozen

      - name: Ruff format (check)
        run: uv run ruff format --check neops_remote_lab tests

      - name: Ruff lint
        run: uv run ruff check neops_remote_lab tests

      - name: Type-check
        run: uv run pyrefly check

      - name: Security audit
        run: uv run pip-audit --strict --progress-spinner=off --vulnerability-service osv

      - name: Run tests
        run: uv run pytest

      - name: Summary
        run: echo "### Ruff/pyrefly/pip-audit/pytest passed ✅" >> $GITHUB_STEP_SUMMARY

  wheel:
    name: Build Python wheel (no publish)
    needs: lint-test
    runs-on: hetzner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies (prod)
        run: uv sync --frozen

      - name: Build wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl
