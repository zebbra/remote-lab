name: Release (Docker + PyPI)

on:
  push:
    tags:
      - '*'


jobs:
  check-semver:
    runs-on: hetzner
    steps:
      - name: Check semver integrity
        uses: zebbra/actions/check-semver@check-semver/v1
        
  publish-python-package:
    runs-on: hetzner
    needs: check-semver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Compute PEP 440 version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Raw tag: ${TAG}"
          VERSION="${TAG#v}"
          if [ -z "${VERSION}" ]; then
            echo "Tag name missing."
            exit 1
          fi

          PEP440_VERSION="$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            BASE="${VERSION%%-*}"
            SUFFIX="${VERSION#*-}"
            STAGE="${SUFFIX%%.*}"
            NUM="${SUFFIX##*.}"
            case "$STAGE" in
              beta)
                PEP440_VERSION="${BASE}b${NUM}"
                ;;
              alpha)
                PEP440_VERSION="${BASE}a${NUM}"
                ;;
              rc)
                PEP440_VERSION="${BASE}rc${NUM}"
                ;;
              dev|develop)
                PEP440_VERSION="${BASE}.dev${NUM}"
                ;;
              *)
                PEP440_VERSION="${BASE}.${SUFFIX}"
                ;;
            esac
          fi

          echo "PEP 440 version: ${PEP440_VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pep440=${PEP440_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Python package
        run: |
          set -euo pipefail
          PEP440_VERSION="${{ steps.version.outputs.pep440 }}"
          TAG="${{ steps.version.outputs.tag }}"
          echo "Using tag ${TAG} -> version ${PEP440_VERSION}"

          pip install --upgrade pip
          pip install poetry
          poetry version "${PEP440_VERSION}"
          poetry build
          echo "Built version ${PEP440_VERSION}"

      - name: Publish Python package
        env:
          PYPI_TOKEN: ${{ secrets.PY_PI_TOKEN }}
        run: |
          pip install poetry
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN secret token is not set. Exiting."
            exit 1
          fi
          poetry config pypi-token.pypi $PYPI_TOKEN
          (poetry publish --skip-existing --no-interaction) || true
