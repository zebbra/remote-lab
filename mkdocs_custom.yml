site_name: Neops Remote Lab

# Append extra extensions on top of the base set:
# - pymdownx.tabbed: rest-api / cURL walkthroughs that use `=== "cURL"` style content tabs.
# - def_list: definition-list rendering (Term\n:   Definition) used by the glossary.
markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - def_list

nav:
  - Start: index.md
  - Get started:
      - "Get started": getting-started/index.md
      - "Run your first test": getting-started/10-quickstart.md
      - "Run locally": getting-started/20-local-server.md
      - "Drive from cURL": getting-started/30-rest-quickstart.md
      - "Wire into CI": getting-started/40-ci-quickstart.md
  - Use from Python:
      - "Use from Python": 20-client/index.md
      - "Pytest fixtures": 20-client/10-pytest-fixtures.md
      - "Python client": 20-client/20-python-client.md
      - "Client config": 20-client/30-configuration.md
  - Run the service:
      - "Run the service": 30-server/index.md
      - "REST API": 30-server/10-rest-api.md
      - "Server config": 30-server/20-configuration.md
      - "Operator runbook": 30-server/30-administration.md
      - "Security model": 30-server/40-security.md
      - "Debugging": 30-server/50-debugging.md
  - Deploy & Operate:
      - "Deploy & Operate": 40-deployment/index.md
      - "Netlab host": 40-deployment/10-netlab-host-setup.md
      - "VPN: quick setup": 40-deployment/20-headscale-quick-setup.md
      - "VPN: reference": 40-deployment/30-headscale-reference.md
      - "Vendor setup": 40-deployment/40-vendor-setup.md
  - Concepts:
      - "Concepts": 10-concepts/index.md
      - "Architecture": 10-concepts/10-architecture.md
      - "Session queue": 10-concepts/20-session-queue.md
      - "Lab lifecycle": 10-concepts/30-lab-lifecycle.md
      - "Topology format": 10-concepts/40-topology-format.md
  - Contributing:
      - "Contributing": 50-contributing/index.md
      - "Dev setup": 50-contributing/10-dev-setup.md
      - "Invariants": 50-contributing/20-invariants.md
      - "Async discipline": 50-contributing/30-internals-async.md
      - "LabManager": 50-contributing/40-internals-lab-manager.md
      - "atexit & lifespan": 50-contributing/50-internals-atexit.md
      - "Test stubbing": 50-contributing/60-internals-test-stubbing.md
      - "Anti-patterns": 50-contributing/70-anti-patterns.md
  - Appendix:
      - "Appendix": 99-appendix/index.md
      - "Glossary": 99-appendix/glossary.md
      - "Cookbook": 99-appendix/cookbook.md
      - "Neops ecosystem": 99-appendix/neops-ecosystem.md
#  - Dummy Project: '!include ./submodules/zebbra-mkdocs-dummyproject/mkdocs_custom.yml'


# --8<-- [start:theme]
theme:
  # Dark and light mode, defaults to system theme
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
# --8<-- [end:theme]

# --8<-- [start:repo]
repo_url: https://github.com/zebbra/neops-remote-lab
edit_uri: edit/main/docs
# --8<-- [end:repo]

# --8<-- [start:social]
extra:
  social:
    - icon: fontawesome/solid/house
      link: https://zebbra.ch
      name: Zebbra
# --8<-- [end:social]

# --8<-- [start:copyright]
copyright: Copyright &copy; Zebbra AG
# --8<-- [end:copyright]

plugins:
  # Enables search
  # - git-authors
  # - git-revision-date-localized
  # Monorepo allows to use the !include in the navigation
  - monorepo
  - exclude:
      glob:
        - '*.tmp'
        - '*.pdf'
        - '*.gz'
        - node_modules
        - '**/node_modules/*'
        - .venv
        - '**/.venv/*'
      regex:
        - .*\.(tmp|bin|tar)$